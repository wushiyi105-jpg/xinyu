[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xinyu"
version = "0.1.0"
description = "记录心情,分析情绪与压力源,看长期趋势"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
xinyu = "xinyu.cli:main"

[tool.setuptools]
packages = ["xinyu"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
